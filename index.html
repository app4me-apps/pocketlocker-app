<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Locker — Coming Soon</title>
<meta name="description" content="Pocket Locker — a private, encrypted document vault. Coming soon.">
<link rel="stylesheet" href="style.css">
<style>
  .soon-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .soon-logo { width: 96px; height: 96px; border-radius: 24px; margin-bottom: 28px; }
  .soon-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; margin-bottom: 12px; }
  .soon-sub {
    background: var(--gradient-brand);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-weight: 700;
    margin-bottom: 20px;
  }
  .soon-text { color: var(--text-muted); max-width: 440px; margin-bottom: 36px; }
  .soon-links { display: flex; gap: 20px; font-size: 0.85rem; }
  .soon-links a { color: var(--text-muted); text-decoration: none; }
  .soon-links a:hover { color: var(--text); }
</style>
</head>
<body>

<div class="soon-wrap">
  <img src="logo.png?v=3" alt="Pocket Locker" class="soon-logo">
  <h1 class="soon-title">Pocket Locker</h1>
  <p class="soon-sub">Coming soon</p>
  <p class="soon-text">
    A private, encrypted vault for your passwords, IDs, and important documents. Launching soon.
  </p>
  <div class="soon-links">
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
    <span>support@pocketlocker.app</span>
  </div>
</div>

</body>
</html>
